name: build

# Branch CI: lints, tests and builds the amd64 and arm64 binaries, uploading
# them as artifacts. Also callable, so the release workflow builds the very
# same binaries it publishes.

on:
  push:
    branches:
      - "**"
  workflow_call:

jobs:
  build-amd64:
    name: Build rops binary for amd64
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: run linters
        run: make lint-check
      - name: Run tests
        run: cargo test
      - name: Build rops binary
        run: cargo build --release
      - name: Upload artifact (binary)
        uses: actions/upload-artifact@v4
        with:
          name: rops-amd64-
          if-no-files-found: error
          path: target/release/rops

  build-arm64:
    name: Build rops binary for arm64
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install GCC for arm64
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Run tests
        run: cargo test
      - name: Build rops binary for arm64
        run: rustup target add aarch64-unknown-linux-gnu && cargo build --release --target aarch64-unknown-linux-gnu
      - name: Upload artifact (binary for arm64)
        uses: actions/upload-artifact@v4
        with:
          name: rops-arm64-
          if-no-files-found: error
          path: target/aarch64-unknown-linux-gnu/release/rops

